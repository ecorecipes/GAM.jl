# Advisory configuration matching the codebase's de facto style (default
# JuliaFormatter style, 4-space indent, ~100-column lines, no alignment).
# Formatting has not been applied wholesale; see CONTRIBUTING.md. Run the
# formatter only on files you are already changing, and avoid drive-by
# reformatting of untouched code.
indent = 4
margin = 100
always_for_in = false
whitespace_typedefs = false
whitespace_ops_in_indices = false
remove_extra_newlines = false
align_assignment = false
align_struct_field = false
align_conditional = false
align_pair_arrow = false
trailing_comma = false
normalize_line_endings = "unix"
