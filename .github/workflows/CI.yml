name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: 2
      GAM_SKIP_RCALL: "true"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1']
        os: ['ubuntu-latest']
        include:
          - version: 1
            os: 'macos-latest'
          - version: 1
            os: 'windows-latest'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  test-rcall:
    name: Julia 1 - ubuntu-latest - R comparison (informative)
    continue-on-error: true
    env:
      JULIA_NUM_THREADS: 2
      # Cap concurrent precompile workers: the default scales with cores and
      # each worker holds its own image, which is the peak-memory driver here.
      JULIA_NUM_PRECOMPILE_TASKS: 2
      # Run ONLY the R-comparison files (17 of 96). Running all of them here
      # duplicates the gating `Julia 1 - ubuntu-latest` job, and on top of a
      # full R installation it exhausted the runner: the test process died
      # ~8 minutes in with no output, no test failure and no Test Summary.
      # Locally this subset is 812 assertions in 6m19s against real R, where
      # the whole suite is ~55 minutes.
      GAM_RCALL_ONLY: "true"
      GAM_TEST_PROGRESS: "true"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          # Never fail the job on a package that the Julia side already skips
          # per-package: the point of this job is to run whatever comparisons
          # ARE available, and report what is missing.
          Rscript -e 'install.packages(c("mgcv", "scam", "qgam", "gamlss", "evd", "evgam", "gratia", "nlme", "remotes"), Ncpus = 2)' || true
          Rscript -e 'remotes::install_github("mfasiolo/gamFactory")' || echo "gamFactory install failed (its comparison tests will skip)"
          Rscript -e 'install.packages("egpd")' || echo "egpd install failed (its comparison tests will skip)"
          Rscript -e 'for (p in c("mgcv","scam","qgam","gamlss","evd","evgam","gratia","gamFactory","egpd")) cat(sprintf("%-12s %s\n", p, if (requireNamespace(p, quietly = TRUE)) "OK" else "MISSING"))'
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-rcall-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-rcall-${{ env.cache-name }}-
      - uses: julia-actions/julia-buildpkg@v1
      - name: Precompile
        # Separate from the test step so a precompile failure shows its actual
        # error. `julia-runtest` reported only "Failed to precompile
        # RCall → RCallAxisArraysExt" with no error body, which is the
        # signature of the precompile worker being killed rather than erroring.
        # That extension is third-party glue GAM.jl never calls; it precompiles
        # fine locally under the same --check-bounds=yes --code-coverage flags,
        # so the difference is this job's resources, not the code.
        run: julia --project=. -e 'using Pkg; Pkg.precompile()'
      - name: Run tests
        # Deliberately NOT julia-actions/julia-runtest here. Evidence: with the
        # action, `RCall -> RCallAxisArraysExt` fails to precompile with no
        # error body; the standalone `Precompile` step above, on the same
        # runner and the same environment, succeeds. So plain precompilation
        # works and the action's extra flags are what break it — it adds
        # --warn-overwrite=yes --depwarn=yes --inline=yes --track-allocation=none
        # on top of the --check-bounds=yes that `Pkg.test()` already uses.
        # That extension is third-party glue GAM.jl never calls.
        #
        # `Pkg.test()` is also exactly what CLAUDE.md declares authoritative,
        # so this job now runs the same command a developer runs locally.
        run: julia --project=. -e 'using Pkg; Pkg.test()'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Configure doc environment
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
