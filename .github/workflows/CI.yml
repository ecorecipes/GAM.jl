name: CI
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: 2
      GAM_SKIP_RCALL: "true"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1']
        os: ['ubuntu-latest']
        include:
          - version: 1
            os: 'macos-latest'
          - version: 1
            os: 'windows-latest'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  test-rcall:
    name: Julia 1 - ubuntu-latest - R comparison
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: 2
      # Cap concurrent precompile workers: the default scales with cores and
      # each worker holds its own image, which is the peak-memory driver here.
      JULIA_NUM_PRECOMPILE_TASKS: 2
      # Run the R comparison files and shared runner/probe checks, without
      # duplicating the full Julia suite and its large MCMC dependency load.
      GAM_RCALL_ONLY: "true"
      GAM_REQUIRE_RCALL: "true"
      GAM_TEST_PROGRESS: "true"
      GAM_RCALL_LOG: ${{ runner.temp }}/rcall-probe.log
      # Compile on demand instead of precompiling the unused MCMC/plotting
      # test dependencies for this R-only job.
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Configure R for RCall
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=$r_home" >> "$GITHUB_ENV"
          # R's launcher sets this for Rscript, but embedded R in Julia
          # bypasses that launcher. Posit R's grDevices/stats/etc. otherwise
          # fail to resolve their libR.so dependency on Ubuntu.
          echo "LD_LIBRARY_PATH=$r_home/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          Rscript -e 'print(sessionInfo()); print(.libPaths()); stopifnot(file.exists(file.path(R.home("lib"), "libR.so")))'
      - name: Install R packages
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript .github/scripts/install-r-dependencies.R
      - uses: actions/cache@v4
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-rcall-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-rcall-${{ env.cache-name }}-
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests
        # Pkg.test supplies test-only dependencies, including RCall. Strict
        # mode rejects missing packages and empty/skipped comparison files.
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Preserve RCall probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcall-probe
          path: ${{ runner.temp }}/rcall-probe.log
          if-no-files-found: warn
          retention-days: 14
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Configure doc environment
        run: |
          julia --project=docs/ -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
